<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat - Jimmy Games</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 id="heading">Chat - Jimmy Games</h1>
  
  <div id="setup-container">
    <h2 id="auth-title">Sign In</h2>
    <form id="setup-form">
      <input type="text" id="username-input" placeholder="Username" required maxlength="25" />
      <input type="password" id="password-input" placeholder="Password" required />
      <button type="submit" id="auth-submit-btn">Sign In</button>
    </form>
    <p id="auth-error" style="color: red;"></p>
    <button type="button" id="toggle-auth-mode">Need an account? Register</button>
  </div>
  
  <div id="page" style="display: none;">
    <h1 id="heading"></h1>
    <form id="chat-form">
      <input type="text" id="chat-input" placeholder="Type a message..." />
      <button type="submit">Send</button>
    </form>
    <div id="chat-container"></div>
  </div>
  
  
  <script src="client.js" type="module"></script>
</body>
</html>
